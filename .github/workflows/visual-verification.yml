name: EARTHWORK visual verification
on:
  push:
    branches: [main, review/visual-check]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright three@0.160.1 sharp
      - run: npx playwright install --with-deps chromium
      - run: node tests/visual-verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earthwork-visual-report
          path: verification-output/
