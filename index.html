function installAutoUpdate(env){
 const {location,document,window}=env;
 if(/[?&]verify=1(?:&|$)/.test(location.search))return null;

  if(!available||available<=current||reloading||!env.canUpdate())return false;
  const key='earthwork-reload-'+available,now=env.now();
  try{const old=Number(env.storage.getItem(key)||0);if(old&&now-old<30000)return false;env.storage.setItem(key,String(now))}catch{}
  reloading=true;location.replace(env.versionURL(available,now));return true;

  if(reloading||checking||document.visibilityState==='hidden')return;
  if(apply())return;
  const now=env.now();if(!force&&now-lastCheck<5000)return;
  lastCheck=now;checking=true;
  try{
   const res=await env.fetch(env.checkURL(now),{cache:'no-store'});if(!res.ok)return;
   const page=await res.text(),match=page.match(/world\.js\?v=(\d+)/);const latest=Number(match?.[1]||0);
   if(latest>current){available=latest;apply()}
  }catch{}finally{checking=false}

}
