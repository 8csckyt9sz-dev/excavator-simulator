<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>EXCAVATOR SIM</title><style>*{box-sizing:border-box;touch-action:none}body{margin:0;background:#10171c;color:#fff;font:14px system-ui;overflow:hidden}canvas{width:100vw;height:100dvh;display:block}button,select{background:#26333c;color:#fff;border:1px solid #58656a;border-radius:8px;padding:12px;font:inherit}button.active{background:#c89024;color:#111}#menu{position:absolute;inset:0;display:grid;place-items:center;background:#10171cbb}article{width:min(440px,92vw);padding:25px;background:#17232c;border:1px solid #52606b;border-radius:15px}h1{font-size:25px;margin:0 0 12px}label{display:block;margin:12px 0 5px}select{width:100%}#hud{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}#hud button{padding:8px}#status{background:#111b;padding:8px;border-radius:6px}#controls{position:absolute;bottom:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.stick{width:116px;height:116px;border:2px solid #ffffff65;border-radius:50%;background:#17232c99;position:relative;pointer-events:auto}.knob{position:absolute;width:46px;height:46px;border-radius:50%;background:#aeb9bc;border:5px solid #34454c;left:33px;top:33px;pointer-events:none}.stick span{position:absolute;top:-23px;width:150%;font-size:12px;text-shadow:0 1px 3px #000}.pedals{display:flex;gap:5px;pointer-events:auto}.pedals div{display:grid;gap:5px}.pedals button{padding:10px 15px}#hint{position:absolute;top:63px;left:12px;background:#10171cbb;padding:8px;max-width:75%;border-radius:5px} [hidden]{display:none!important}@media(max-height:450px){.stick{width:100px;height:100px}.knob{left:25px;top:25px}article{padding:12px}label{margin:5px 0}article h1{font-size:18px}select{padding:6px}}</style><canvas id="c"></canvas><div id="hud" hidden><button id="back">機械選択</button><button id="engine">始動</button><button id="lock">ロック解除</button><button id="view">外部視点</button><button id="pattern">配列 A</button><button id="reset">リセット</button><span id="status"></span></div><div id="hint" hidden></div><div id="controls" hidden><div class="stick" id="left"><span id="ll">旋回 / アーム</span><div class="knob"></div></div><div class="pedals"><div><button data-drive="0,1">左 ▲</button><button data-drive="0,-1">左 ▼</button></div><div><button data-drive="1,1">右 ▲</button><button data-drive="1,-1">右 ▼</button></div><div><button id="aux">補助油圧</button></div></div><div class="stick" id="right"><span id="rr">バケット / ブーム</span><div class="knob"></div></div></div><div id="menu"><article><small>EARTHWORK / PROTOTYPE 01</small><h1>重機運転シミュレーター</h1><label>機械クラス（バケット容量目安）</label><select id="machine"><option>0.03</option><option>0.1</option><option>0.15</option><option selected>0.25</option><option>0.45</option><option>0.7</option><option>1.2</option></select><label>アタッチメント</label><select id="attachment"><option>標準バケット</option><option>法面バケット</option><option>幅狭バケット</option><option>ブレーカー</option><option>フォーク</option><option>スケルトンバケット</option><option>大割機</option><option>小割機</option></select><label>モード</label><select id="mode"><option>自由運転</option><option>始動・操作練習</option></select><p style="color:#aab7c1;font-size:12px">試作：操作・走行・視点切替。掘削物理と正式な試験採点は未実装。</p><button id="start" style="width:100%;background:#e6aa32;color:#151515;font-weight:bold">乗車する</button></article></div><script>
const $=s=>document.getElementById(s),cv=$('c'),ctx=cv.getContext('2d');let W,H,scale=1,att=0,engine=false,unlocked=false,cab=true,pat=0,x=0,z=0,yaw=0,swing=0,b=.75,a=-1.35,k=-.45,aux=0,active=false,practice=false,sticks=[[0,0],[0,0]],drive=[0,0],polys=[],camera,forward,right,up;const clamp=(v,l,h)=>Math.max(l,Math.min(h,v)),add=(a,b)=>a.map((v,i)=>v+b[i]),sub=(a,b)=>a.map((v,i)=>v-b[i]),mul=(a,s)=>a.map(v=>v*s),dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0),cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],norm=a=>mul(a,1/Math.hypot(...a));function rot(p,t){return [p[0]*Math.cos(t)+p[2]*Math.sin(t),p[1],-p[0]*Math.sin(t)+p[2]*Math.cos(t)]}function world(p,t=yaw+swing){return add(rot(mul(p,scale),t),[x,0,z])}function cam(pos,target){camera=pos;forward=norm(sub(target,pos));right=norm(cross([0,1,0],forward));up=cross(forward,right)}function project(p){let v=sub(p,camera),d=dot(v,forward);if(d<.12)return null;let f=Math.min(W,H)*.93;return [W/2+dot(v,right)*f/d,H*.48-dot(v,up)*f/d,d]}function face(v,c){let p=v.map(project);if(p.some(q=>!q))return;polys.push({p,c,d:p.reduce((s,q)=>s+q[2],0)/p.length})}function box(center,size,t,color,angle=0){let v=[];for(let i=0;i<8;i++){let p=[(i&1?1:-1)*size[0]/2,(i&2?1:-1)*size[1]/2,(i&4?1:-1)*size[2]/2];let yy=p[1]*Math.cos(angle)-p[2]*Math.sin(angle),zz=p[1]*Math.sin(angle)+p[2]*Math.cos(angle);v.push(world(add(center,[p[0],yy,zz]),t))}let fs=[[0,1,3,2],[4,6,7,5],[0,4,5,1],[2,3,7,6],[0,2,6,4],[1,5,7,3]];fs.forEach((f,i)=>face(f.map(j=>v[j]),color[i%color.length]))}const yellow=['#b77c12','#dca329','#95620e','#f4c34d','#c98a19'],dark=['#283033','#424b4b','#181e20','#555d5c'],glass=['#526d78','#779aa5','#344952','#9bb3b8'];function beam(p,q,w,h,colors=yellow){let d=sub(q,p);box(mul(add(p,q),.5),[w,h,Math.hypot(d[1],d[2])],yaw+swing,colors,-Math.atan2(d[1],d[2]))}function line(p,q,c,width=1){p=project(p);q=project(q);if(!p||!q)return;ctx.strokeStyle=c;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1]);ctx.stroke()}function draw(){let dpr=Math.min(devicePixelRatio,2);W=cv.clientWidth;H=cv.clientHeight;if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=W*dpr;cv.height=H*dpr}ctx.setTransform(dpr,0,0,dpr,0,0);let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#82b2cc');sky.addColorStop(.55,'#d8e1df');sky.addColorStop(.56,'#a38b64');sky.addColorStop(1,'#776347');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);if(cab)cam(world([-.58,2.53,.15]),world([-.30,1.65,7]));else cam(world([7,5.5,-8],yaw),world([0,1.4,1],yaw));polys=[];let baseX=Math.floor(x/4)*4,baseZ=Math.floor(z/4)*4;for(let i=-10;i<10;i++)for(let j=-10;j<10;j++){let X=baseX+i*4,Z=baseZ+j*4;face([[X,0,Z],[X+4,0,Z],[X+4,0,Z+4],[X,0,Z+4]],(i+j)%2?'#a48c67':'#a9926c')}for(let s of [-1,1]){box([s*.83,.35,0],[.56,.62,3.05],yaw,dark);for(let i=-6;i<=6;i++)box([s*.83,.68,i*.22],[.61,.055,.16],yaw,['#555a57','#343a38'])}box([0,.85,0],[1.6,.35,2.05],yaw,dark);box([0,1.28,-.48],[1.95,.65,1.8],yaw+swing,yellow);box([.62,1.8,-.65],[.65,.45,1.25],yaw+swing,yellow);if(!cab){box([-.6,2.02,.12],[.8,1.23,1.3],yaw+swing,glass);box([-.6,2.68,.12],[.88,.13,1.38],yaw+swing,yellow)}let p=[.38,1.45,.55],q=add(p,[0,2.25*Math.sin(b),2.25*Math.cos(b)]),r=add(q,[0,1.65*Math.sin(b+a),1.65*Math.cos(b+a)]),angle=b+a+k;beam(p,q,.38,.39);beam(q,r,.28,.27);beam(add(p,[-.23,-.12,-.12]),add(q,[-.23,-.15,-.2]),.09,.09,dark);let tip=add(r,[0,.62*Math.sin(angle),.62*Math.cos(angle)]);if(att===3){beam(r,add(r,[0,1.05*Math.sin(angle),1.05*Math.cos(angle)]),.32,.32,dark);beam(add(r,[0,.8*Math.sin(angle),.8*Math.cos(angle)]),add(r,[0,1.4*Math.sin(angle),1.4*Math.cos(angle)]),.09,.09)}else if(att===4||att>=6){for(let s of [-1,1])beam(add(r,[s*.25,0,0]),add(tip,[s*(.28+aux*.22),-.2,0]),.14,.25,dark)}else{let w=att===1?1.3:att===2?.38:.77;box(mul(add(r,tip),.5),[w,.49,.68],yaw+swing,dark,-angle);for(let i=0;i<4;i++)box(add(tip,[(i-1.5)*w/4,-.13,.12]),[.085,.12,.22],yaw+swing,yellow,-angle)}polys.sort((a,b)=>b.d-a.d);for(let f of polys){ctx.fillStyle=f.c;ctx.beginPath();f.p.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fill();}if(cab){ctx.fillStyle='#20292c';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(W*.085,0);ctx.lineTo(W*.15,H);ctx.lineTo(0,H);ctx.fill();ctx.fillRect(W*.94,0,W*.06,H);ctx.fillRect(0,H*.89,W,H*.11);ctx.fillRect(0,0,W,H*.055);ctx.fillStyle='#36454a';ctx.fillRect(W*.79,H*.63,W*.14,H*.22);ctx.fillStyle='#111e25';ctx.fillRect(W*.80,H*.65,W*.12,H*.17);ctx.fillStyle=engine?'#8ee092':'#899297';ctx.font='12px monospace';ctx.fillText(engine?'ENGINE ON':'OFF',W*.805,H*.70);ctx.fillText(unlocked?'UNLOCK':'LOCK',W*.805,H*.75)} }
function update(dt){if(engine&&unlocked&&active){let l=sticks[0],r=sticks[1];swing-=l[0]*dt*.9;b=clamp(b-(pat?l[1]:r[1])*dt*.75,-.25,1.38);a=clamp(a-(pat?r[1]:l[1])*dt*.85,-2.4,-.15);k=clamp(k-r[0]*dt*1.2,-1.8,.65);let speed=(drive[0]+drive[1])*.65*scale;yaw+=(drive[0]-drive[1])*dt*.65;x+=Math.sin(yaw)*speed*dt;z+=Math.cos(yaw)*speed*dt;} $('status').textContent=(engine?'始動中':'停止')+' / '+(unlocked?'操作可':'安全ロック')+' / '+$('machine').value+' m³';$('hint').textContent=practice?(!engine?'① エンジンを始動してください':!unlocked?'② 安全ロックを解除してください':'③ 左右レバーと走行ペダルを操作してください'):'自由運転｜地面との衝突・掘削は未実装';}let last=0;function frame(t){update(Math.min(.05,(t-last)/1000||0));last=t;draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
function reset(){x=z=yaw=swing=0;b=.75;a=-1.35;k=-.45;aux=0;engine=unlocked=false;sticks=[[0,0],[0,0]];drive=[0,0];sync()}function sync(){$('engine').textContent=engine?'停止':'始動';$('lock').textContent=unlocked?'ロックする':'ロック解除';$('engine').classList.toggle('active',engine);$('lock').classList.toggle('active',unlocked);$('view').textContent=cab?'外部視点':'運転席視点'}$('start').onclick=()=>{scale=[.45,.65,.82,1,1.2,1.45,1.75][$('machine').selectedIndex];att=$('attachment').selectedIndex;practice=$('mode').selectedIndex===1;active=true;cab=true;reset();$('menu').hidden=true;for(let n of ['hud','controls','hint'])$(n).hidden=false};$('back').onclick=()=>{active=false;reset();$('menu').hidden=false;for(let n of ['hud','controls','hint'])$(n).hidden=true};$('engine').onclick=()=>{if(!engine&&unlocked)return;engine=!engine;if(!engine)unlocked=false;sync()};$('lock').onclick=()=>{if(engine)unlocked=!unlocked;sync()};$('view').onclick=()=>{cab=!cab;sync()};$('pattern').onclick=()=>{pat=1-pat;$('pattern').textContent='配列 '+(pat?'B':'A');$('ll').textContent=pat?'旋回 / ブーム':'旋回 / アーム';$('rr').textContent=pat?'バケット / アーム':'バケット / ブーム'};$('reset').onclick=reset;$('aux').onclick=()=>{if(engine&&unlocked)aux=1-aux};['left','right'].forEach((name,i)=>{let el=$(name),id=null;function move(e){let r=el.getBoundingClientRect(),xx=(e.clientX-r.left-r.width/2)/(r.width*.35),yy=(e.clientY-r.top-r.height/2)/(r.height*.35),m=Math.max(1,Math.hypot(xx,yy));sticks[i]=[xx/m,yy/m];el.firstElementChild.nextElementSibling.style.transform=`translate(${xx/m*r.width*.29}px,${yy/m*r.height*.29}px)`}el.onpointerdown=e=>{if(id!==null)return;id=e.pointerId;el.setPointerCapture(id);move(e)};el.onpointermove=e=>{if(e.pointerId===id)move(e)};el.onpointerup=el.onpointercancel=e=>{if(e.pointerId!==id)return;id=null;sticks[i]=[0,0];el.querySelector('.knob').style.transform='none'}});document.querySelectorAll('[data-drive]').forEach(el=>{let [i,v]=el.dataset.drive.split(',').map(Number);el.onpointerdown=e=>{el.setPointerCapture(e.pointerId);drive[i]=v;el.classList.add('active')};el.onpointerup=el.onpointercancel=()=>{drive[i]=0;el.classList.remove('active')}});window.onblur=()=>{sticks=[[0,0],[0,0]];drive=[0,0]};
</script></html>
