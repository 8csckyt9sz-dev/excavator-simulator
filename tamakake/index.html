;gap:5px}#ruby{width:auto;min-height:36px;font-size:12px;padding:5px 8px;margin:0}header small{white-space:nowrap}</style><main><header><small>KUBO LAB / SLINGING</small><div class="header-controls"><button type="button" id="ruby">ふりがな ON</button><select id="lang" aria-label="Language"><option value="ja">日本語</option><option value="id">Indonesia</option></select></div></header><h1 id="title"></h1><div id="screen"></div><footer class="fine muted" id="footer"></footer></main><script>window.EXAM_BASE={"path":"tamakake/index.html","name":["玉掛け技能講習","Pelatihan pengikatan beban"],"brand":"KUBO LAB / SLINGING","source":"https://www.mhlw.go.jp/web/t_doc?dataId=74031000&dataType=0","cats":[["クレーンの知識","Pengetahuan crane"],["力学","Mekanika"],["玉掛け方法・合図","Metode rigging dan isyarat"],["関係法令","Peraturan"]],"rows":[[0,1,"巻過防止装置はフックなどの巻き上げ過ぎを防止する。","Pembatas overhoist mencegah hook terangkat terlalu tinggi.","巻過ぎによる衝突や破損を防ぐ安全装置である。","Alat keselamatan ini mencegah benturan dan kerusakan akibat pengangkatan berlebih."],[0,0,"クレーンのブレーキは荷を保持する必要がない。","Rem crane tidak perlu menahan beban.","荷の保持や停止に必要である。","Rem diperlukan untuk menahan dan menghentikan beban."],[0,1,"移動式クレーンの定格荷重は作業半径などにより変化する。","Kapasitas angkat terukur mobile crane berubah sesuai radius kerja dan kondisi lain.","荷重表と実際の作業条件を照合する。","Cocokkan tabel kapasitas dengan kondisi kerja."],[0,0,"安全装置に異常があっても注意すれば使用してよい。","Crane dengan alat keselamatan rusak boleh digunakan asal berhati-hati.","異常がある場合は使用を中止し対処する。","Hentikan penggunaan dan tangani kerusakan."],[0,1,"フックの外れ止めは玉掛用具の外れを防止するためのものだ。","Pengunci hook mencegah sling terlepas.","外れ止めの状態も確認する。","Periksa juga kondisi pengunci hook."],[0,0,"定格荷重は全てのブーム長・作業半径で一定である。","Kapasitas angkat terukur selalu sama untuk semua panjang boom dan radius.","作業条件ごとの荷重表を確認する。","Periksa tabel kapasitas sesuai kondisi kerja."],[1,1,"力のモーメントは力と支点から作用線までの垂直距離の積である。","Momen gaya adalah gaya dikali jarak tegak lurus dari titik tumpu ke garis kerja gaya.","M＝F×d。","M = F × d."],[1,0,"左右対称の2本つりでは、つり角度が大きくなるほど各ロープの張力は小さくなる。","Pada pengangkatan simetris dua sling, makin besar sudut antara sling makin kecil tegangannya.","つり角度が大きいほど張力は増える。","Makin besar sudut antara sling, makin besar tegangan."],[1,1,"急激な巻上げや停止で荷に作用する力が増えることがある。","Pengangkatan atau penghentian mendadak dapat memperbesar gaya pada beban.","動荷重が発生するためである。","Hal ini disebabkan oleh beban dinamis."],[1,0,"形状が不均一な荷の重心は必ず外形の中心にある。","Pusat gravitasi beban tidak seragam selalu berada di tengah bentuknya.","質量分布で重心は変わる。","Pusat gravitasi bergantung pada distribusi massa."],[1,1,"同じ体積なら密度が大きい材料ほど質量が大きい。","Pada volume yang sama, bahan dengan densitas lebih tinggi memiliki massa lebih besar.","質量＝密度×体積。","Massa = densitas × volume."],[1,0,"つり荷が静止していれば、玉掛用具に張力は生じない。","Jika beban tergantung diam, sling tidak mengalami tegangan.","静止中も荷重を支える力が働く。","Gaya untuk menopang beban tetap bekerja."],[2,1,"玉掛け前に荷の質量・重心・つり方を確認する。","Sebelum rigging, periksa massa, pusat gravitasi dan metode pengangkatan.","適切な用具選定と安定したつり方に必要。","Diperlukan untuk memilih perlengkapan dan metode yang stabil."],[2,0,"つり荷の真下を短時間なら通過してよい。","Boleh lewat tepat di bawah beban tergantung jika sebentar.","つり荷の下には立ち入らない。","Jangan masuk ke bawah beban tergantung."],[2,1,"地切り時に荷の安定や玉掛用具の状態を確認する。","Saat beban baru terangkat dari tanah, periksa kestabilan dan kondisi sling.","異常があれば安全に下ろして見直す。","Jika ada masalah, turunkan dengan aman dan periksa kembali."],[2,0,"鋭い角のある荷にワイヤロープを直接当てても保護は不要である。","Wire rope boleh langsung menyentuh sudut tajam tanpa pelindung.","損傷防止のため適切な当て物等が必要。","Gunakan pelindung yang sesuai untuk mencegah kerusakan."],[2,1,"合図者は運転者と合図方法を事前に確認する。","Pemberi isyarat harus menyepakati metode isyarat dengan operator sebelum bekerja.","意思疎通の誤りを防ぐ。","Cegah kesalahan komunikasi."],[2,0,"キンクしたワイヤロープも見た目を戻せばそのまま使用してよい。","Wire rope yang mengalami kink boleh digunakan jika bentuknya dikembalikan.","キンクは廃棄基準に該当する。","Kink merupakan kriteria pembuangan wire rope."],[3,1,"クレーン等のつり上げ荷重が1トン以上の場合、玉掛けには原則として技能講習修了等の資格が必要である。","Untuk crane dengan kapasitas angkat 1 ton atau lebih, rigging pada prinsipnya memerlukan kualifikasi seperti pelatihan keterampilan.","基準は実際の荷の重さではなく機械のつり上げ荷重。","Patokannya kapasitas angkat crane, bukan berat beban aktual."],[3,0,"つり上げ荷重2トンのクレーンで500kgの荷を扱う場合、荷が軽いので特別教育だけで玉掛けできる。","Untuk crane berkapasitas 2 ton, beban 500 kg boleh di-rigging hanya dengan pendidikan khusus karena ringan.","機械のつり上げ荷重で資格区分が決まる。","Kualifikasi ditentukan kapasitas angkat mesin."],[3,1,"つり上げ荷重1トン未満のクレーン等の玉掛け業務には原則として特別教育が必要である。","Rigging untuk crane berkapasitas kurang dari 1 ton pada prinsipnya memerlukan pendidikan khusus.","資格区分に応じた教育を受ける。","Ikuti pendidikan sesuai kategori kualifikasi."],[3,0,"ワイヤロープがキンクしていても、定格荷重以下なら法令上使用できる。","Wire rope yang kink boleh digunakan menurut hukum jika beban di bawah kapasitas.","クレーン等安全規則に使用禁止の規定がある。","Peraturan keselamatan crane melarang penggunaan tersebut."],[3,1,"玉掛用具はその日の作業開始前に異常の有無を点検する。","Perlengkapan rigging diperiksa terhadap kelainan sebelum pekerjaan hari itu dimulai.","クレーン等安全規則の作業開始前点検による。","Sesuai aturan pemeriksaan sebelum kerja."],[3,0,"玉掛け技能講習修了だけで全種類のクレーンを運転できる。","Sertifikat rigging saja mengizinkan pengoperasian semua jenis crane.","運転資格と玉掛け資格は別である。","Kualifikasi operator dan rigging berbeda."]]};</script><script src="questions-v2.js?v=2"></script><script src="../exam-v2.js?v=2"></script></html>
