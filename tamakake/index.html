const D={"path":"tamakake/index.html","name":["玉掛け技能講習","Pelatihan pengikatan beban"],"brand":"KUBO LAB / SLINGING","source":"https://www.mhlw.go.jp/web/t_doc?dataId=74031000&dataType=0","cats":[["クレーンの知識","Pengetahuan crane"],["力学","Mekanika"],["玉掛け方法・合図","Metode rigging dan isyarat"],["関係法令","Peraturan"]],"rows":[[0,1,"巻過防止装置はフックなどの巻き上げ過ぎを防止する。","Pembatas overhoist mencegah hook terangkat terlalu tinggi.","巻過ぎによる衝突や破損を防ぐ安全装置である。","Alat keselamatan ini mencegah benturan dan kerusakan akibat pengangkatan berlebih."],[0,0,"クレーンのブレーキは荷を保持する必要がない。","Rem crane tidak perlu menahan beban.","荷の保持や停止に必要である。","Rem diperlukan untuk menahan dan menghentikan beban."],[0,1,"移動式クレーンの定格荷重は作業半径などにより変化する。","Kapasitas angkat terukur mobile crane berubah sesuai radius kerja dan kondisi lain.","荷重表と実際の作業条件を照合する。","Cocokkan tabel kapasitas dengan kondisi kerja."],[0,0,"安全装置に異常があっても注意すれば使用してよい。","Crane dengan alat keselamatan rusak boleh digunakan asal berhati-hati.","異常がある場合は使用を中止し対処する。","Hentikan penggunaan dan tangani kerusakan."],[0,1,"フックの外れ止めは玉掛用具の外れを防止するためのものだ。","Pengunci hook mencegah sling terlepas.","外れ止めの状態も確認する。","Periksa juga kondisi pengunci hook."],[0,0,"定格荷重は全てのブーム長・作業半径で一定である。","Kapasitas angkat terukur selalu sama untuk semua panjang boom dan radius.","作業条件ごとの荷重表を確認する。","Periksa tabel kapasitas sesuai kondisi kerja."],[1,1,"力のモーメントは力と支点から作用線までの垂直距離の積である。","Momen gaya adalah gaya dikali jarak tegak lurus dari titik tumpu ke garis kerja gaya.","M＝F×d。","M = F × d."],[1,0,"左右対称の2本つりでは、つり角度が大きくなるほど各ロープの張力は小さくなる。","Pada pengangkatan simetris dua sling, makin besar sudut antara sling makin kecil tegangannya.","つり角度が大きいほど張力は増える。","Makin besar sudut antara sling, makin besar tegangan."],[1,1,"急激な巻上げや停止で荷に作用する力が増えることがある。","Pengangkatan atau penghentian mendadak dapat memperbesar gaya pada beban.","動荷重が発生するためである。","Hal ini disebabkan oleh beban dinamis."],[1,0,"形状が不均一な荷の重心は必ず外形の中心にある。","Pusat gravitasi beban tidak seragam selalu berada di tengah bentuknya.","質量分布で重心は変わる。","Pusat gravitasi bergantung pada distribusi massa."],[1,1,"同じ体積なら密度が大きい材料ほど質量が大きい。","Pada volume yang sama, bahan dengan densitas lebih tinggi memiliki massa lebih besar.","質量＝密度×体積。","Massa = densitas × volume."],[1,0,"つり荷が静止していれば、玉掛用具に張力は生じない。","Jika beban tergantung diam, sling tidak mengalami tegangan.","静止中も荷重を支える力が働く。","Gaya untuk menopang beban tetap bekerja."],[2,1,"玉掛け前に荷の質量・重心・つり方を確認する。","Sebelum rigging, periksa massa, pusat gravitasi dan metode pengangkatan.","適切な用具選定と安定したつり方に必要。","Diperlukan untuk memilih perlengkapan dan metode yang stabil."],[2,0,"つり荷の真下を短時間なら通過してよい。","Boleh lewat tepat di bawah beban tergantung jika sebentar.","つり荷の下には立ち入らない。","Jangan masuk ke bawah beban tergantung."],[2,1,"地切り時に荷の安定や玉掛用具の状態を確認する。","Saat beban baru terangkat dari tanah, periksa kestabilan dan kondisi sling.","異常があれば安全に下ろして見直す。","Jika ada masalah, turunkan dengan aman dan periksa kembali."],[2,0,"鋭い角のある荷にワイヤロープを直接当てても保護は不要である。","Wire rope boleh langsung menyentuh sudut tajam tanpa pelindung.","損傷防止のため適切な当て物等が必要。","Gunakan pelindung yang sesuai untuk mencegah kerusakan."],[2,1,"合図者は運転者と合図方法を事前に確認する。","Pemberi isyarat harus menyepakati metode isyarat dengan operator sebelum bekerja.","意思疎通の誤りを防ぐ。","Cegah kesalahan komunikasi."],[2,0,"キンクしたワイヤロープも見た目を戻せばそのまま使用してよい。","Wire rope yang mengalami kink boleh digunakan jika bentuknya dikembalikan.","キンクは廃棄基準に該当する。","Kink merupakan kriteria pembuangan wire rope."],[3,1,"クレーン等のつり上げ荷重が1トン以上の場合、玉掛けには原則として技能講習修了等の資格が必要である。","Untuk crane dengan kapasitas angkat 1 ton atau lebih, rigging pada prinsipnya memerlukan kualifikasi seperti pelatihan keterampilan.","基準は実際の荷の重さではなく機械のつり上げ荷重。","Patokannya kapasitas angkat crane, bukan berat beban aktual."],[3,0,"つり上げ荷重2トンのクレーンで500kgの荷を扱う場合、荷が軽いので特別教育だけで玉掛けできる。","Untuk crane berkapasitas 2 ton, beban 500 kg boleh di-rigging hanya dengan pendidikan khusus karena ringan.","機械のつり上げ荷重で資格区分が決まる。","Kualifikasi ditentukan kapasitas angkat mesin."],[3,1,"つり上げ荷重1トン未満のクレーン等の玉掛け業務には原則として特別教育が必要である。","Rigging untuk crane berkapasitas kurang dari 1 ton pada prinsipnya memerlukan pendidikan khusus.","資格区分に応じた教育を受ける。","Ikuti pendidikan sesuai kategori kualifikasi."],[3,0,"ワイヤロープがキンクしていても、定格荷重以下なら法令上使用できる。","Wire rope yang kink boleh digunakan menurut hukum jika beban di bawah kapasitas.","クレーン等安全規則に使用禁止の規定がある。","Peraturan keselamatan crane melarang penggunaan tersebut."],[3,1,"玉掛用具はその日の作業開始前に異常の有無を点検する。","Perlengkapan rigging diperiksa terhadap kelainan sebelum pekerjaan hari itu dimulai.","クレーン等安全規則の作業開始前点検による。","Sesuai aturan pemeriksaan sebelum kerja."],[3,0,"玉掛け技能講習修了だけで全種類のクレーンを運転できる。","Sertifikat rigging saja mengizinkan pengoperasian semua jenis crane.","運転資格と玉掛け資格は別である。","Kualifikasi operator dan rigging berbeda."]]},$=id=>document.getElementById(id),S=$("screen"),key="kubo.theory."+D.path;let lang="ja",state="home",mode="",list=[],pos=0,answers={},wrong=[];
try{lang=localStorage.getItem(key+".lang")==="id"?"id":"ja";wrong=JSON.parse(localStorage.getItem(key+".wrong")||"[]");if(!Array.isArray(wrong))wrong=[]}catch{}
const t=(j,i)=>lang==="id"?i:j,idx=()=>lang==="id"?1:0,cat=n=>D.cats[n][idx()],qtext=q=>q[2+idx()],ex=q=>q[4+idx()],ans=v=>v?t("正しい（○）","Benar (○)"):t("誤り（×）","Salah (×)");
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function render(){document.documentElement.lang=lang;$("lang").value=lang;$("title").textContent=D.name[idx()];S.replaceChildren();const f=$("footer");f.replaceChildren();node("p",t("学習用のオリジナル問題です。実際の修了試験や資格を代替するものではありません。","Soal latihan orisinal. Tidak menggantikan ujian resmi atau sertifikasi."),f);const a=node("a",t("厚生労働省：技能講習規程","MHLW: Peraturan pelatihan keterampilan"),f);a.href=D.source;a.target="_blank";a.rel="noopener";if(state==="home")home();if(state==="quiz")quiz();if(state==="result")result()}
function home(){node("p",t("学科模擬試験・練習","Simulasi ujian teori dan latihan"),S,"muted");const c=node("div",undefined,S,"card");node("h3",t("全"+D.rows.length+"問・4科目",""+D.rows.length+" soal · 4 topik"),c);node("p",t("模擬試験：各科目5問、計20問。合計60点以上、全科目40%以上で合格。","Ujian: 5 soal per topik, total 20. Lulus jika total ≥60 dan tiap topik ≥40%."),c,"fine");btn(t("模擬試験を始める","Mulai ujian simulasi"),()=>start("exam"),c,"primary");btn(t("全問練習（解説付き）","Latihan semua soal + penjelasan"),()=>start("practice"),c);btn(t("間違えた問題を復習（"+wrong.length+"問）","Ulangi soal salah ("+wrong.length+")"),()=>start("review"),c).disabled=!wrong.length;node("h3",t("科目別練習","Latihan per topik"),S);D.cats.forEach((_,i)=>btn(cat(i),()=>start("practice",i)));if(D.path==="theory.html"){const a=node("a",t("運転シミュレーターへ戻る","Kembali ke simulator"),S);a.href="./"}}
function start(m,c){mode=m;list=m==="exam"?shuffle(D.cats.flatMap((_,i)=>shuffle(D.rows.map((q,j)=>q[0]===i?j:-1).filter(j=>j>=0)).slice(0,5))):m==="review"?shuffle(wrong.filter(i=>D.rows[i])):shuffle(D.rows.map((q,j)=>c===undefined||q[0]===c?j:-1).filter(j=>j>=0));if(!list.length)return;answers={};pos=0;state="quiz";render()}

function result(){const count=list.filter(i=>answers[i]===D.rows[i][1]).length,score=Math.round(count/list.length*100),stats=D.cats.map((_,k)=>{const a=list.filter(i=>D.rows[i][0]===k);return [a.filter(i=>answers[i]===D.rows[i][1]).length,a.length]});const pass=score>=60&&stats.every(([n,total])=>total&&n/total>=.4);const c=node("div",undefined,S,"card");const sc=node("div",score+" / 100",c);sc.id="score";node("p",count+" / "+list.length,c);if(mode==="exam")node("h2",pass?t("合格（模擬）","LULUS (simulasi)"):t("不合格（模擬）","TIDAK LULUS (simulasi)"),c,pass?"pass":"fail");stats.forEach(([n,total],i)=>{if(total)node("p",cat(i)+"　"+n+"/"+total+"（"+Math.round(n/total*100)+"%）",c)});const misses=list.filter(i=>answers[i]!==D.rows[i][1]);node("h3",t("間違えた問題と解説","Soal salah dan penjelasan"),S);if(!misses.length)node("p",t("全問正解","Semua benar"),S);for(const i of misses){const q=D.rows[i],r=node("div",undefined,S,"review");node("p",qtext(q),r);node("p",t("正解：","Jawaban: ")+ans(q[1]),r,"tag");node("p",ex(q),r)}btn(t("トップへ","Ke menu"),()=>{state="home";render();window.scrollTo(0,0)},S,"primary")}
