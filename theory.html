;gap:5px}#ruby{width:auto;min-height:36px;font-size:12px;padding:5px 8px;margin:0}header small{white-space:nowrap}</style><main><header><small>EARTHWORK / THEORY</small><div class="header-controls"><button type="button" id="ruby">ふりがな ON</button><select id="lang" aria-label="Language"><option value="ja">日本語</option><option value="id">Indonesia</option></select></div></header><h1 id="title"></h1><div id="screen"></div><footer class="fine muted" id="footer"></footer></main><script>window.EXAM_BASE={"path":"theory.html","name":["車両系建設機械","Alat berat konstruksi"],"brand":"EARTHWORK / THEORY","source":"https://www.mhlw.go.jp/web/t_doc?dataId=74144000&dataType=0&pageNo=1","cats":[["走行装置","Sistem perjalanan"],["作業装置・安全作業","Peralatan dan keselamatan kerja"],["力学・土質・施工","Mekanika, tanah, konstruksi"],["関係法令","Peraturan"]],"rows":[[0,1,"ディーゼル機関は圧縮された空気の熱で燃料を着火する。","Mesin diesel menyalakan bahan bakar dengan panas udara yang dikompresi.","圧縮着火方式である。","Ini adalah penyalaan kompresi."],[0,0,"クローラの張りは強ければ強いほどよい。","Semakin kencang track, semakin baik.","メーカー指定の張りに調整する。","Atur ketegangan sesuai petunjuk pabrikan."],[0,0,"エンジンが過熱した直後にラジエータキャップを開けても安全である。","Aman membuka tutup radiator segera setelah mesin terlalu panas.","高温の冷却液が噴き出す危険がある。","Cairan pendingin panas dapat menyembur."],[0,1,"走行モータは油圧エネルギーを回転運動に変える。","Motor travel mengubah energi hidrolik menjadi gerakan putar.","油圧モータが走行装置を駆動する。","Motor hidrolik menggerakkan sistem travel."],[0,1,"警報装置の異常は作業前に対処する。","Kerusakan alat peringatan harus ditangani sebelum bekerja.","安全装置の異常を放置しない。","Jangan abaikan kerusakan perangkat keselamatan."],[0,0,"バッテリーの近くで火気を使用してよい。","Api terbuka boleh digunakan di dekat baterai.","可燃性ガスによる爆発のおそれがある。","Gas mudah terbakar dapat meledak."],[1,1,"油圧シリンダは油圧を直線運動に変換する。","Silinder hidrolik mengubah energi hidrolik menjadi gerakan lurus.","ピストンが作業装置を動かす。","Piston menggerakkan alat kerja."],[1,1,"リリーフ弁は回路の圧力が過大になるのを防ぐ。","Katup relief mencegah tekanan sirkuit berlebihan.","設定圧力を超えないように働く。","Katup membatasi tekanan sesuai pengaturan."],[1,0,"高圧油の漏れは素手で探してよい。","Kebocoran oli bertekanan tinggi boleh dicari dengan tangan telanjang.","高圧油が皮膚に侵入する危険がある。","Oli bertekanan tinggi dapat menembus kulit."],[1,0,"掘削用バケットに人を乗せて移動してよい。","Orang boleh diangkut di dalam bucket penggali.","人を運ぶための装置ではない。","Bucket bukan alat angkut orang."],[1,1,"旋回範囲内の人が安全な位置に移動してから旋回する。","Putar alat setelah orang di area putar berpindah ke tempat aman.","接触・挟まれを防止する。","Cegah benturan dan terjepit."],[1,0,"バケット交換後は取付けの確認を省略してよい。","Setelah mengganti bucket, pemeriksaan pemasangan boleh dilewati.","脱落防止のため固定を確認する。","Periksa penguncian agar bucket tidak lepas."],[2,1,"同じ力なら支点からの垂直距離が長いほどモーメントは大きい。","Untuk gaya yang sama, momen makin besar jika jarak tegak lurus dari titik tumpu makin panjang.","モーメント＝力×垂直距離。","Momen = gaya × jarak tegak lurus."],[2,0,"一般に重心が高いほど転倒しにくい。","Pusat gravitasi yang lebih tinggi umumnya membuat alat lebih sulit terguling.","一般に重心が高いほど安定性は低下する。","Pusat gravitasi lebih tinggi umumnya mengurangi stabilitas."],[2,1,"降雨によって地盤の安定性が低下する場合がある。","Hujan dapat mengurangi kestabilan tanah.","浸透水や地盤の軟化に注意する。","Waspadai infiltrasi air dan pelunakan tanah."],[2,0,"掘削した法面は土質に関係なく同じ勾配で安全である。","Semua lereng galian aman pada kemiringan yang sama tanpa melihat jenis tanah.","土質・高さ・水などに応じた対策が必要。","Tindakan harus sesuai jenis tanah, tinggi dan air."],[2,1,"盛土は適切な層厚で締め固める。","Timbunan dipadatkan dengan ketebalan lapisan yang sesuai.","均一な締固めが重要である。","Pemadatan yang merata penting."],[2,0,"傾斜地での安定性は平地と常に同じである。","Stabilitas di lereng selalu sama dengan di tanah datar.","傾斜によって転倒の余裕が変化する。","Kemiringan mengubah margin kestabilan."],[3,1,"機体質量3トン以上の対象建設機械の運転には原則として技能講習修了等の資格が必要である。","Mengoperasikan alat berat yang termasuk kategori ini dengan massa mesin 3 ton atau lebih pada prinsipnya memerlukan kualifikasi seperti pelatihan keterampilan.","労働安全衛生法令による就業制限がある。","Peraturan K3 membatasi pekerjaan ini."],[3,0,"対象建設機械の運転資格はバケット容量だけで判断する。","Kualifikasi operator ditentukan hanya oleh kapasitas bucket.","機体質量等で判断する。","Penentuan antara lain berdasarkan massa mesin."],[3,1,"作業に先立ち、地形・地質等を調査し、危険防止のための作業計画を定める必要がある。","Sebelum bekerja, kondisi medan dan tanah harus diperiksa dan rencana kerja untuk mencegah bahaya ditetapkan.","安衛則の作業計画に関する規定による。","Sesuai aturan K3 tentang rencana kerja."],[3,0,"運転位置を離れるときはバケットを上げたままでよい。","Saat meninggalkan kursi operator, bucket boleh tetap terangkat.","作業装置を地上に下ろすなど逸走防止措置が必要。","Turunkan alat kerja dan cegah gerakan tak terkendali."],[3,1,"作業開始前にブレーキ等の機能を点検する必要がある。","Fungsi rem dan perangkat terkait harus diperiksa sebelum pekerjaan dimulai.","安衛則に作業開始前点検の規定がある。","Aturan K3 mewajibkan pemeriksaan sebelum kerja."],[3,0,"技能講習を修了すれば公道を走るための運転免許も自動的に取得できる。","Selesai pelatihan keterampilan otomatis memperoleh SIM untuk jalan umum.","公道走行の免許は別制度である。","SIM untuk jalan umum adalah sistem terpisah."]]};</script><script src="theory-questions-v2.js?v=2"></script><script src="exam-v2.js?v=2"></script></html>
